<div class="min-h-screen bg-stone-50 flex flex-col">
  <!-- Header -->
  <header class="h-14 border-b border-stone-200">
    <div class="h-full max-w-7xl mx-auto px-6 flex items-center">
      <div class="flex items-center gap-2">
        <div class="flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-brand-500"></span>
          <span class="w-2 h-2 rounded-full bg-brand-400"></span>
        </div>
        <span class="text-sm font-semibold text-stone-800">The Green Dots</span>
      </div>
    </div>
  </header>

  <!-- Empty state -->
  <main class="flex-1 flex items-center justify-center p-6">
    <div class="max-w-7xl mx-auto w-full flex items-center justify-center">
      <div class="w-full max-w-sm text-center">
        <!-- Icon -->
        <div class="mx-auto w-12 h-12 rounded-xl bg-brand-100 flex items-center justify-center mb-5">
          <svg class="w-6 h-6 text-brand-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18 18.72a9.094 9.094 0 0 0 3.741-.479 3 3 0 0 0-4.682-2.72m.94 3.198.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0 1 12 21c-2.17 0-4.207-.576-5.963-1.584A6.062 6.062 0 0 1 6 18.719m12 0a5.971 5.971 0 0 0-.941-3.197m0 0A5.995 5.995 0 0 0 12 12.75a5.995 5.995 0 0 0-5.058 2.772m0 0a3 3 0 0 0-4.681 2.72 8.986 8.986 0 0 0 3.74.477m.94-3.197a5.971 5.971 0 0 0-.94 3.197M15 6.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm6 3a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0Zm-13.5 0a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0Z" />
          </svg>
        </div>

        <!-- Copy -->
        <h1 class="text-lg font-semibold text-stone-900 mb-2">
          Connect your team
        </h1>
        <p class="text-sm text-stone-500 mb-6 leading-relaxed">
          Link your Microsoft tenant to start tracking your team's presence history.
        </p>

        <!-- CTA -->
        <button
          (click)="startAddOrganization()"
          class="inline-flex items-center gap-2 px-4 py-2.5 bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium rounded-lg transition-colors"
        >
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
          Add Organization
        </button>

        <!-- Subtle hint -->
        <p class="mt-5 text-xs text-stone-400">
          You'll sign in with Microsoft to grant access
        </p>
      </div>
    </div>
  </main>
</div>
